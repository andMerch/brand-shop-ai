services:
  - type: web
    name: brand-shop-web
    env: node
    plan: starter
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @app/web build
    startCommand: pnpm --filter @app/web start
    envVars:
      - key: APP_BASE_URL
        value: https://brand-shop-web.onrender.com
      - key: API_BASE_URL
        fromService:
          name: brand-shop-api
          type: web
          property: host
  - type: web
    name: brand-shop-api
    env: node
    plan: starter
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @app/api build
    startCommand: pnpm --filter @app/api start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brand-shop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: brand-shop-redis
          type: redis
          property: connectionString
      - key: GHL_BASE_URL
        value: https://services.leadconnectorhq.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: ai-vision
  - type: worker
    name: brand-shop-worker
    env: node
    plan: starter
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @app/worker build
    startCommand: pnpm --filter @app/worker start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brand-shop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: brand-shop-redis
          type: redis
          property: connectionString
      - key: GHL_BASE_URL
        value: https://services.leadconnectorhq.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

redis:
  - name: brand-shop-redis
    plan: starter

databases:
  - name: brand-shop-db
    plan: starter
